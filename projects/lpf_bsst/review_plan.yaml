# Review plan for the LPF/BSST drawing.
#
# This is triage, not engineering data: it sorts the open points of the topology into
#   holds      - a yes/no (or short) engineering decision; shown on the drawing as H1, H2 ... and in the hold list.
#                `drawn_as` says what the drawing shows today, so the reviewer only has to confirm or correct it.
#   datasheet  - values that do not change the drawing (sizes, ranges, tags...); listed once, completed on datasheets.
# To close a hold, set `answer:` (e.g. "accepted" or the decision).  `pid run` then drops the marker and keeps the
# answer in the decision register.  Changing the drawing itself still goes through the topology / project rules.
holds:
  - ur: ur.ech_position
    title: "Emergency exchangers ECH-030..032 – parallel or series?"
    drawn_as: "Parallel branch of the cooling-water loop, beside the heat-pump evaporators."
    answer: null
  - ur: ur.cascade_2a_2b
    title: "PAC 2A/2B – physical cascade?"
    drawn_as: "2A condenser feeds the 2B evaporator through the 55/50 °C internal loop; only 2B delivers 85/105 °C to RCUA."
    answer: null
  - ur: ur.loop_pump_position
    title: "Circulation pumps of the fermenter leg and hot-water loops"
    drawn_as: "Only P-033..035 (TK-002 outlet). No other pump drawn – the specification names none."
    answer: null
  - ur: ur.tank_count
    title: "RCUA buffer – one tank or one per temperature level?"
    drawn_as: "One RCUA buffer tank (85/105 °C)."
    answer: null
  - ur: ur.spill_control
    title: "Spill valves 8→4 and 4→1 bar – control philosophy"
    drawn_as: "Control valves with manifolds, no control loop (variable, setpoint and fail position not given)."
    answer: null
  - ur: ur.flash_tank
    title: "Flash tank – liquid destination and CMV staging"
    drawn_as: "Flash vapour → CMV stages 1-2-3 in series; 70 °C liquid outlet left open."
    answer: null
  - ur: ur.tge_coil
    title: "Air-preheating coil – 85 °C limit on a 90 °C header"
    drawn_as: "One coil (TGE example) fed directly from the 90/70 °C header; no tempering arrangement."
    answer: null
  - ur: ur.degasser_steam
    title: "Thermal degasser – 4 bar or 1 bar steam?"
    drawn_as: "Steam inlet left unconnected."
    answer: null
  - ur: ur.degasser_hx_medium
    title: "Make-up water heater (12→80 °C) – heating medium"
    drawn_as: "Hot side left open."
    answer: null
  - ur: ur.lpf_tank_loops
    title: "LPF tank heating loops – pump and steam supply"
    drawn_as: "Plate exchangers on the tank loops; retained steam exchangers on standby with open steam/condensate nozzles."
    answer: null
  - ur: ur.ultimate_feed
    title: "Ultimate mode – well-water feed to the fermenters"
    drawn_as: "Only the post-fermenter discharge to DARSE is drawn."
    answer: null
  - ur: ur.hw_backup
    title: "Hot-water networks – local steam back-up equipment"
    drawn_as: "Not drawn (not described)."
    answer: null
  - ur: ur.rcua_limits
    title: "RCUA network battery limits"
    drawn_as: "Placeholder battery-limit flags for the 105 °C supply and 85 °C return."
    answer: null
  - ur: ur.gen.valve_technology
    title: "Valve technology of the generic valves"
    drawn_as: "Generic valve symbol, DEXPI CustomOperatedValve 'technology to be selected'."
    answer: null

datasheet:   # completed on datasheets / line list – no change to the drawing
  - ur.hw_dn
  - ur.internal_loop
  - ur.boiler
  - ur.tags
  - ur.nozzles
  - ur.design_data
  - ur.future_hp
  - ur.gen.fail_position
  - ur.gen.instrument_ranges
  - ur.gen.nozzles

notes:       # general notes printed on the sheet (project-specific)
  - "Draft generated from the specification 'Cahier des Charges P&ID Consolidé' – not for construction."
  - "Orange items are additions proposed by the project rules (valves, instruments, tags, line numbers); approval is per rule, see the decision register."
  - "Line numbers are <service code>-<sequence>. Sizes and piping classes are not given in the specification and are not shown unless stated (DN)."
  - "Valve failure positions, design pressures, relief devices, instrument ranges and nozzle sizes are not given and are not assumed."
  - "Future heat pumps PAC 3A/3B are shown dashed and unconnected (LifeCyclePhase = Future)."
  - "Operating modes (normal, emergency exchangers, ultimate) are realised with the isolation valves shown; see the operating-mode report."
